name: ci

on:
  push:
  pull_request:

# Read-only token: forks and pull requests never get write access or secrets.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      # the red-team tests read forged pages back with the Tesseract program
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      # the optional `ocr` extra (ocrmac, rapidocr) is not installed in CI
      - run: uv sync --dev
      - run: uv lock --check
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      # known-vulnerability scan of the locked Python dependencies (TRM 6.1.3)
      - name: Dependency vulnerability scan (Python)
        run: |
          uv export --no-hashes --no-emit-project -q > /tmp/requirements-audit.txt
          uvx pip-audit -r /tmp/requirements-audit.txt --no-deps --disable-pip
      - name: Check catalogue is up to date
        run: |
          if [ -f backend/scripts/gen_check_catalogue.py ]; then
            uv run python backend/scripts/gen_check_catalogue.py --check
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22   # vitest 5 needs Node 22.12 or newer
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - name: Dependency vulnerability scan (npm, production dependencies)
        run: npm audit --omit=dev --audit-level=high
